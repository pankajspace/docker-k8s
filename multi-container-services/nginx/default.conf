# Upstream definition pointing to the React client container on port 3000
# (resolved via Docker Compose's internal DNS using the 'client' service name).
upstream client {
  server client:3000;
}

# Upstream definition pointing to the Express API container on port 5000
# (resolved via Docker Compose's internal DNS using the 'api' service name).
upstream api {
  server api:5000;
}

server {
  # Listen for incoming HTTP traffic inside the nginx container on port 80
  # (exposed as port 3050 on the host in docker-compose.yml).
  listen 80;

  # Route all standard frontend page and asset requests to the React client service.
  location / {
    proxy_pass http://client;
  }

  # Enable WebSocket proxying for Create React App's Webpack Dev Server
  # Hot Module Replacement (HMR) live-reload connection during development.
  location /ws {
      proxy_pass http://client;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
  }

  # Route all backend API requests to the Express server.
  # The rewrite rule strips the '/api' prefix before forwarding (e.g., /api/values/all -> /values/all),
  # and 'break' stops Nginx from re-evaluating other location blocks after rewriting.
  location /api {
    rewrite /api/(.*) /$1 break;
    proxy_pass http://api;
  }
}
