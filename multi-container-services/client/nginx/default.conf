# Nginx configuration used inside the PRODUCTION client container (client/Dockerfile)
# to serve the compiled static React Single-Page Application (SPA) bundle.
server {
  # Listen on port 3000 to match the upstream 'client:3000' expected by the outer reverse proxy.
  listen 3000;

  location / {
    # Directory where the multi-stage Docker build copies the output of 'npm run build'.
    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA fallback: try to serve the requested file or directory first; if not found
    # (e.g., client-side React Router routes like /otherpage), serve /index.html instead of 404.
    try_files $uri $uri/ /index.html;
  }
}
