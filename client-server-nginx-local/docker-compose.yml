# Docker Compose configuration for the simplified 3-service Fibonacci app
# (nginx reverse proxy, React client, and Express API server with in-memory storage).
services:
  # Reverse proxy acting as the single public entry point for both frontend and backend traffic.
  nginx:
    # Ensures api and client containers are started before nginx attempts to route traffic to them.
    depends_on:
      - api
      - client
    # Automatically restart nginx if it exits (e.g., if upstream services aren't ready on first boot).
    restart: always
    build:
      dockerfile: Dockerfile.dev
      context: ./nginx
    ports:
      # Maps host port 3050 to container port 80 (access the app at http://localhost:3050).
      - '3050:80'

  # Express REST API server (container port 5000) with in-memory storage and Fibonacci calculation.
  api:
    build:
      dockerfile: Dockerfile.dev
      context: ./server
    volumes:
      # Anonymous volume preserves the container's installed node_modules from being overwritten by the bind mount.
      - /app/node_modules
      # Bind mount syncs local ./server source changes into the container for live reload with nodemon.
      - ./server:/app

  # React Single-Page Application dev server (Vite on container port 3000).
  client:
    build:
      dockerfile: Dockerfile.dev
      context: ./client
    volumes:
      # Preserves container-installed node_modules.
      - /app/node_modules
      # Syncs local ./client source files for instant hot-reloading.
      - ./client:/app
