# Docker Compose configuration for local development of the simplified 3-service Fibonacci app
# (Nginx reverse proxy, React client, and Express API server with in-memory storage).
# All services automatically join a shared default bridge network and can reach each other
# using their service names (nginx, api, client) as DNS hostnames.
# Start with: docker compose up --build
services:
  # Reverse proxy acting as the single public entry point for both frontend (/) and backend (/api) traffic.
  nginx:
    # Starts api and client containers before nginx so upstream hostnames exist on startup.
    depends_on:
      - api
      - client
    # Automatically restarts nginx whenever it exits (e.g., if upstream services aren't ready on first boot).
    restart: always
    # Build the Nginx image locally from ./nginx/Dockerfile.dev using ./nginx as the build context.
    build:
      dockerfile: Dockerfile.dev
      context: ./nginx
    ports:
      # Maps host port 3050 to container port 80 (open http://localhost:3050 in your browser).
      - '3050:80'

  # Express REST API server (container port 5000) handling Fibonacci calculation and in-memory storage.
  api:
    # Build the API dev image from ./server/Dockerfile.dev using ./server as the build context.
    build:
      dockerfile: Dockerfile.dev
      context: ./server
    volumes:
      # Anonymous volume preserves the container's /app/node_modules so the bind mount below doesn't hide it.
      - /app/node_modules
      # Bind mount syncs local ./server source edits directly into the container for live reload via nodemon.
      - ./server:/app

  # React Single-Page Application dev server (Vite on container port 3000, proxied by nginx).
  client:
    # Build the frontend dev image from ./client/Dockerfile.dev using ./client as the build context.
    build:
      dockerfile: Dockerfile.dev
      context: ./client
    volumes:
      # Anonymous volume preserves the container's /app/node_modules from being overwritten by the bind mount.
      - /app/node_modules
      # Bind mount syncs local ./client source files into the container for instant Vite HMR hot-reloading.
      - ./client:/app
