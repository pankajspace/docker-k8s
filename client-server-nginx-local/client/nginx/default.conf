# Nginx configuration used inside the PRODUCTION client container (client/Dockerfile)
# to serve the compiled static React Single-Page Application (SPA) bundle.

# Define the HTTP virtual server block for this container.
server {
  # Listen on port 3000 (instead of Nginx's default port 80) so the production container
  # matches the same 'client:3000' upstream port used by Vite in development.
  listen 3000;

  # Match all incoming request paths to serve static assets and client-side routes.
  location / {
    # Document root where Stage 2 of client/Dockerfile copies the compiled Vite output (/app/dist).
    root /usr/share/nginx/html;

    # Default entry files to serve when a directory path (such as '/') is requested.
    index index.html index.htm;

    # SPA fallback order for every request:
    #   1. $uri        - Serve the exact static file if it exists (e.g., JS, CSS, images).
    #   2. $uri/       - Otherwise, serve it as a directory if one exists.
    #   3. /index.html - Otherwise, fall back to index.html so React Router can handle client-side routes (e.g., /otherpage) on refresh instead of returning 404.
    try_files $uri $uri/ /index.html;
  }
}
