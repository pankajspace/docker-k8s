# Production Docker Compose stack for AWS EC2 (Express API + Nginx + Certbot HTTPS).
# Run from the ec2/ directory after creating .env from .env.example:
#   docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

services:
  # Express API server — kept private on the internal Docker network (not exposed to host).
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
    expose:
      - "5000"

  # Nginx reverse proxy — terminates HTTPS on :443 using Let's Encrypt certificates
  # provisioned by Certbot and forwards traffic to api:5000 over the internal Docker network.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_DOMAIN=${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]

  # Certbot — issues the initial Let's Encrypt certificate via HTTP-01 webroot challenge
  # and renews it automatically every 12 hours.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      - API_DOMAIN=${API_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c '
      trap exit TERM;
      while :; do
        if [ ! -f "/etc/letsencrypt/live/$${API_DOMAIN}/fullchain.pem" ]; then
          sleep 5;
          if [ -n "$${ACME_EMAIL}" ]; then
            EMAIL_ARGS="--email $${ACME_EMAIL}";
          else
            EMAIL_ARGS="--register-unsafely-without-email";
          fi;
          certbot certonly --webroot -w /var/www/certbot \
            -d "$${API_DOMAIN}" \
            $$EMAIL_ARGS \
            --agree-tos --non-interactive && continue;
          sleep 15m & wait $${!};
        else
          certbot renew --webroot -w /var/www/certbot --quiet || true;
          sleep 12h & wait $${!};
        fi;
      done
      '

# Named volumes persist ACME challenge files and TLS certificates across container restarts/rebuilds
# so you don't hit Let's Encrypt rate limits.
volumes:
  certbot_www:
  certbot_conf:
