# Production Docker Compose stack for AWS EC2 (Express API + Caddy automatic HTTPS).
# Run from the ec2/ directory after creating .env from .env.example:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  # Express API server — kept private on the internal Docker network (not exposed to host).
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
    expose:
      - "5000"

  # Caddy reverse proxy — terminates HTTPS on :443 with automatic Let's Encrypt certificates
  # and forwards traffic to api:5000 over the internal Docker network.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_DOMAIN=${API_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# Named volumes persist TLS certificates and Caddy state across container restarts/rebuilds
# so you don't hit Let's Encrypt rate limits.
volumes:
  caddy_data:
  caddy_config:
