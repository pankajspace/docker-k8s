# GitHub Actions CI/CD pipeline: runs React unit tests, builds & pushes production
# Docker images to Docker Hub, and deploys the multi-container bundle to AWS Elastic Beanstalk.
name: Deploy Multi-Container Services

on:
  push:
    branches:
      # Trigger deployment automatically on every push to the main branch.
      - main # check your repo, your default branch might be master!
    paths:
      # Only run when files in multi-container-services or this workflow change.
      - 'multi-container-services/**'
      - '.github/workflows/multi-container-services-deploy.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-container-services
    steps:
      # 1. Check out the repository source code onto the runner.
      - uses: actions/checkout@v3

      # 2. Authenticate with Docker Hub using encrypted repository secrets.
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build the development client image and run the Jest test suite in non-interactive CI mode.
      - run: docker build -t rallycoding/react-test-up -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true rallycoding/react-test-up npm test

      # 4. Build optimized production Docker images for all four custom services.
      - run: docker build -t rallycoding/multi-client-up ./client
      - run: docker build -t rallycoding/multi-nginx-up ./nginx
      - run: docker build -t rallycoding/multi-server-up ./server
      - run: docker build -t rallycoding/multi-worker-up ./worker

      # 5. Push all production images to Docker Hub so Elastic Beanstalk can pull them.
      - run: docker push rallycoding/multi-client-up
      - run: docker push rallycoding/multi-nginx-up
      - run: docker push rallycoding/multi-server-up
      - run: docker push rallycoding/multi-worker-up

      # 6. Bundle project deployment artifacts (excluding .git metadata) into a zip archive.
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      # 7. Upload deploy.zip to S3 and deploy the new version to AWS Elastic Beanstalk.
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v18
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          existing_bucket_name: elasticbeanstalk-us-east-1-923445559289
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: multi-container-services/deploy.zip
