name: Deploy client-server-prod

on:
  push:
    branches:
      - main
    paths:
      - "client-server-prod/**"
      - ".github/workflows/client-server-prod.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which component(s) to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - client
          - server

permissions:
  id-token: write
  contents: read

concurrency:
  group: client-server-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-client:
    name: Build & Deploy Frontend (S3 + CloudFront)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'client'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production React bundle
        working-directory: client-server-prod/client
        env:
          VITE_API_URL: https://api.fib1.techtoday.click
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync frontend bundle to S3
        env:
          S3_BUCKET: ${{ vars.FIB1_S3_BUCKET }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "ERROR: FIB1_S3_BUCKET repository variable is not set."
            exit 1
          fi
          aws s3 sync client-server-prod/client/dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp client-server-prod/client/dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.FIB1_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "ERROR: FIB1_CLOUDFRONT_DISTRIBUTION_ID repository variable is not set."
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

  deploy-server:
    name: Deploy Backend (EC2 + Caddy)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'server'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate server syntax
        run: node --check client-server-prod/server/index.js

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_HOST and EC2_SSH_KEY secrets must be set."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync server & EC2 config to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${EC2_HOST}" "mkdir -p ~/client-server-prod/server ~/client-server-prod/ec2"
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            client-server-prod/server/ "ec2-user@${EC2_HOST}:~/client-server-prod/server/"
          rsync -avz --delete \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            client-server-prod/ec2/ "ec2-user@${EC2_HOST}:~/client-server-prod/ec2/"

      - name: Rebuild and restart containers on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${EC2_HOST}" << 'EOF'
            set -e
            cd ~/client-server-prod/ec2
            if [ ! -f .env ]; then
              echo "ERROR: ~/client-server-prod/ec2/.env is missing on EC2."
              exit 1
            fi
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
