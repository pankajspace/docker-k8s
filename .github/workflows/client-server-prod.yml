name: Deploy client-server-prod

on:
  push:
    branches:
      - main
    paths:
      - "client-server-prod/**"
      - ".github/workflows/client-server-prod.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which component(s) to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - infra-and-client
          - server

permissions:
  id-token: write
  contents: read

concurrency:
  group: client-server-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-infra-and-client:
    name: Build Frontend & Deploy AWS CDK Stack
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'infra-and-client'
    runs-on: ubuntu-latest
    outputs:
      ec2_public_ip: ${{ steps.stack-outputs.outputs.ec2_public_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production React bundle
        working-directory: client-server-prod/client
        env:
          VITE_API_URL: https://api.fib1.techtoday.click
        run: |
          npm ci
          npm run build

      - name: Install and typecheck CDK infrastructure
        working-directory: client-server-prod/infra
        run: |
          npm ci
          npm run typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Synthesize and deploy CDK stack
        working-directory: client-server-prod/infra
        env:
          FRONTEND_DOMAIN: fib1.techtoday.click
          API_DOMAIN: api.fib1.techtoday.click
          ACM_CERTIFICATE_ARN: ${{ vars.FIB1_ACM_CERTIFICATE_ARN }}
          EC2_KEY_PAIR_NAME: ${{ vars.EC2_KEY_PAIR_NAME }}
          ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
        run: |
          npm run synth
          npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Read EC2 Elastic IP output
        id: stack-outputs
        working-directory: client-server-prod/infra
        run: |
          EC2_IP=$(node -e "const o = require('./cdk-outputs.json'); console.log(o.ClientServerProdStack.Ec2PublicIp || '');")
          echo "ec2_public_ip=${EC2_IP}" >> "$GITHUB_OUTPUT"

  deploy-server:
    name: Deploy Backend (EC2 + Caddy)
    needs: deploy-infra-and-client
    if: |
      always() &&
      (needs.deploy-infra-and-client.result == 'success' || needs.deploy-infra-and-client.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'server')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate server syntax
        run: node --check client-server-prod/server/index.js

      - name: Resolve EC2 host IP
        id: resolve-host
        env:
          OUTPUT_IP: ${{ needs.deploy-infra-and-client.outputs.ec2_public_ip }}
          FALLBACK_IP: ${{ secrets.EC2_HOST }}
        run: |
          HOST_IP="${OUTPUT_IP:-$FALLBACK_IP}"
          if [ -z "$HOST_IP" ]; then
            echo "ERROR: Could not determine EC2 host IP from CDK outputs or EC2_HOST secret."
            exit 1
          fi
          echo "host=${HOST_IP}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ steps.resolve-host.outputs.host }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync server & EC2 config to EC2
        env:
          EC2_HOST: ${{ steps.resolve-host.outputs.host }}
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${EC2_HOST}" "mkdir -p ~/client-server-prod/server ~/client-server-prod/ec2"
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            client-server-prod/server/ "ec2-user@${EC2_HOST}:~/client-server-prod/server/"
          rsync -avz --delete \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            client-server-prod/ec2/ "ec2-user@${EC2_HOST}:~/client-server-prod/ec2/"

      - name: Rebuild and restart containers on EC2
        env:
          EC2_HOST: ${{ steps.resolve-host.outputs.host }}
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${EC2_HOST}" << 'EOF'
            set -e
            cd ~/client-server-prod/ec2
            if [ ! -f .env ]; then
              echo "ERROR: ~/client-server-prod/ec2/.env is missing on EC2."
              exit 1
            fi
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
