name: Deploy client-server-prod

on:
  push:
    branches:
      - main
    paths:
      - "client-server-prod/**"
      - ".github/workflows/client-server-prod.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which component(s) to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - client
          - server

concurrency:
  group: client-server-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-client:
    name: Build & Deploy Frontend (S3 + CloudFront)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'client'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-server-prod/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client-server-prod/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync dist/ to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  deploy-server:
    name: Deploy Backend (EC2 + Caddy)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'server'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate server syntax
        run: node --check client-server-prod/server/index.js

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync server & EC2 config to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" "mkdir -p ~/client-server-prod/server ~/client-server-prod/ec2"
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            client-server-prod/server/ "${EC2_USER}@${EC2_HOST}:~/client-server-prod/server/"
          rsync -avz --delete \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            client-server-prod/ec2/ "${EC2_USER}@${EC2_HOST}:~/client-server-prod/ec2/"

      - name: Rebuild and restart containers on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" << 'EOF'
            set -e
            cd ~/client-server-prod/ec2
            if [ ! -f .env ]; then
              echo "ERROR: ~/client-server-prod/ec2/.env is missing on EC2. Create it from .env.example first."
              exit 1
            fi
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
