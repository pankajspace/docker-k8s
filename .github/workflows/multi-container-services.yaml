# GitHub Actions CI pipeline: runs React unit tests and verifies production
# Docker image builds for all custom services in multi-container-services.
name: CI - Multi-Container Services

on:
  push:
    branches:
      - main
    paths:
      - 'multi-container-services/**'
      - '!multi-container-services/**/*.md'
      - '.github/workflows/multi-container-services.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'multi-container-services/**'
      - '!multi-container-services/**/*.md'
      - '.github/workflows/multi-container-services.yaml'
  workflow_dispatch:

jobs:
  test:
    name: Run Client Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-container-services
    steps:
      - uses: actions/checkout@v4

      - name: Build development client image
        run: docker build -t multi-client-test -f ./client/Dockerfile.dev ./client

      - name: Run Jest unit tests
        run: docker run -e CI=true multi-client-test npm test

  build:
    name: Build Production Docker Images
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-container-services
    strategy:
      fail-fast: false
      matrix:
        service: [client, nginx, server, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -t multi-${{ matrix.service }} ./${{ matrix.service }}
