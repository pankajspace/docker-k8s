name: Deploy multi-container-services-prod

on:
  push:
    branches:
      - main
    paths:
      - "multi-container-services-prod/**"
      - ".github/workflows/multi-container-services-prod.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: multi-container-services-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Stack (AWS CDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate server and worker syntax
        run: |
          node --check multi-container-services-prod/server/index.js
          node --check multi-container-services-prod/server/keys.js
          node --check multi-container-services-prod/worker/index.js
          node --check multi-container-services-prod/worker/keys.js

      - name: Build React client bundle
        working-directory: multi-container-services-prod/client
        run: |
          npm ci
          npm run build

      - name: Install and typecheck CDK infrastructure
        working-directory: multi-container-services-prod/infra
        run: |
          npm ci
          npm run typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Synthesize and deploy CDK stack
        working-directory: multi-container-services-prod/infra
        run: |
          npm run synth
          npx cdk deploy --require-approval never
