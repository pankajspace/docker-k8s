name: Deploy multi-container-services-prod

on:
  push:
    branches:
      - main
    paths:
      - "multi-container-services-prod/**"
      - ".github/workflows/multi-container-services-prod.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which component(s) to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - client
          - services

permissions:
  id-token: write
  contents: read

concurrency:
  group: multi-container-services-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-client:
    name: Build & Deploy Frontend (S3 + CloudFront)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'client'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build React client bundle
        working-directory: multi-container-services-prod/client
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync frontend bundle to S3
        env:
          S3_BUCKET: ${{ vars.FIB2_S3_BUCKET }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "ERROR: FIB2_S3_BUCKET repository variable is not set."
            exit 1
          fi
          aws s3 sync multi-container-services-prod/client/dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp multi-container-services-prod/client/dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.FIB2_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "ERROR: FIB2_CLOUDFRONT_DISTRIBUTION_ID repository variable is not set."
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

  deploy-services:
    name: Build & Deploy Services (ECR + ECS Fargate)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'services'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate server and worker syntax
        run: |
          node --check multi-container-services-prod/server/index.js
          node --check multi-container-services-prod/server/keys.js
          node --check multi-container-services-prod/worker/index.js
          node --check multi-container-services-prod/worker/keys.js

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API & Worker images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_API_REPO: ${{ vars.FIB2_ECR_API_REPO }}
          ECR_WORKER_REPO: ${{ vars.FIB2_ECR_WORKER_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$ECR_API_REPO" ] || [ -z "$ECR_WORKER_REPO" ]; then
            echo "ERROR: FIB2_ECR_API_REPO and FIB2_ECR_WORKER_REPO repository variables must be set."
            exit 1
          fi

          docker build --platform linux/amd64 \
            -t "${ECR_REGISTRY}/${ECR_API_REPO}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_API_REPO}:latest" \
            multi-container-services-prod/server
          docker push "${ECR_REGISTRY}/${ECR_API_REPO}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_API_REPO}:latest"

          docker build --platform linux/amd64 \
            -t "${ECR_REGISTRY}/${ECR_WORKER_REPO}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_WORKER_REPO}:latest" \
            multi-container-services-prod/worker
          docker push "${ECR_REGISTRY}/${ECR_WORKER_REPO}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_WORKER_REPO}:latest"

      - name: Trigger rolling ECS Fargate deployments
        env:
          ECS_CLUSTER: ${{ vars.FIB2_ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.FIB2_ECS_API_SERVICE }}
          ECS_WORKER_SERVICE: ${{ vars.FIB2_ECS_WORKER_SERVICE }}
        run: |
          if [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_API_SERVICE" ] || [ -z "$ECS_WORKER_SERVICE" ]; then
            echo "ERROR: FIB2_ECS_CLUSTER, FIB2_ECS_API_SERVICE, and FIB2_ECS_WORKER_SERVICE repository variables must be set."
            exit 1
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --force-new-deployment

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE" "$ECS_WORKER_SERVICE"
