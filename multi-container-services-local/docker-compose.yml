# Docker Compose configuration for local development of the multi-container Fibonacci app
# (PostgreSQL, Redis, Nginx reverse proxy, Express API server, React client, and background worker).
# All services defined here automatically join a shared default bridge network and can
# reach one another using their service names (postgres, redis, api, client, worker) as DNS hostnames.
# Start with: docker compose up --build
services:
  # Relational database storing a permanent history of all submitted Fibonacci indexes (internal port 5432).
  postgres:
    # Pull the official PostgreSQL image from Docker Hub.
    image: 'postgres:latest'
    environment:
      # Default superuser password required by the official Postgres image on initialization.
      - POSTGRES_PASSWORD=postgres_password

  # In-memory key-value store (calculated Fibonacci hash) and Pub/Sub message broker (internal port 6379).
  redis:
    # Pull the official Redis image from Docker Hub (no extra config required for local dev).
    image: 'redis:latest'

  # Reverse proxy acting as the single public entry point for both frontend (/) and backend (/api) traffic.
  nginx:
    # Starts api and client containers before nginx so upstream hostnames exist on startup.
    depends_on:
      - api
      - client
    # Automatically restarts nginx whenever it exits (e.g., if upstream services aren't ready on first boot).
    restart: always
    # Build the Nginx image locally from ./nginx/Dockerfile using ./nginx as the build context.
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      # Maps host port 3050 to container port 80 (open http://localhost:3050 in your browser).
      - '3050:80'

  # Express REST API server (container port 5000) coordinating requests between Postgres and Redis.
  api:
    # Build the API dev image from ./server/Dockerfile using ./server as the build context.
    build:
      dockerfile: Dockerfile
      context: ./server
    volumes:
      # Anonymous volume preserves the container's /app/node_modules so the bind mount below doesn't hide it.
      - /app/node_modules
      # Bind mount syncs local ./server source edits directly into the container for live reload via nodemon.
      - ./server:/app
    environment:
      # Redis connection settings using the 'redis' Docker service name as hostname.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # PostgreSQL connection settings using the 'postgres' Docker service name as hostname.
      - PGUSER=postgres
      - PGHOST=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=postgres_password
      - PGPORT=5432

  # React Single-Page Application dev server (Vite on container port 3000, proxied by nginx).
  client:
    # Build the frontend dev image from ./client/Dockerfile using ./client as the build context.
    build:
      dockerfile: Dockerfile
      context: ./client
    volumes:
      # Anonymous volume preserves the container's /app/node_modules from being overwritten by the bind mount.
      - /app/node_modules
      # Bind mount syncs local ./client source files into the container for instant Vite HMR hot-reloading.
      - ./client:/app

  # Background worker subscribed to Redis 'insert' events to asynchronously calculate Fibonacci values.
  worker:
    # Build the worker dev image from ./worker/Dockerfile using ./worker as the build context.
    build:
      dockerfile: Dockerfile
      context: ./worker
    volumes:
      # Anonymous volume preserves the container's /app/node_modules from being overwritten by the bind mount.
      - /app/node_modules
      # Bind mount syncs local ./worker source edits into the container for live reload via nodemon.
      - ./worker:/app
    environment:
      # Redis connection settings using the 'redis' Docker service name as hostname.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
