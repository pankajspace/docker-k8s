# Nginx reverse-proxy configuration acting as the single entry point for the application.
# Serves both the React frontend (/) and Express API (/api) from the same origin,
# avoiding browser CORS issues and hiding internal container ports from the host.

# Named upstream group pointing to the React client container on port 3000.
# Docker Compose's embedded DNS resolves the 'client' hostname to the client container's IP.
upstream client {
  server client:3000;
}

# Named upstream group pointing to the Express API container on port 5000.
# Docker Compose's embedded DNS resolves the 'api' hostname to the api container's IP.
upstream api {
  server api:5000;
}

# Main HTTP server block handling all external requests entering the reverse proxy.
server {
  # Listen for incoming HTTP traffic inside the nginx container on port 80
  # (mapped to host port 3050 in docker-compose.yml -> http://localhost:3050).
  listen 80;

  # Route all frontend page, static asset, and Vite HMR WebSocket requests to the client service.
  location / {
    # Forward the request to the 'client' upstream group defined above.
    proxy_pass http://client;

    # Use HTTP/1.1 for upstream connections (Nginx defaults to HTTP/1.0, which does not support WebSockets).
    proxy_http_version 1.1;

    # Forward the client's Upgrade header (e.g., 'websocket') so Vite's live-reload HMR handshake works.
    proxy_set_header Upgrade $http_upgrade;

    # Signal to the upstream server that the connection should be upgraded (required for WebSockets).
    proxy_set_header Connection "Upgrade";

    # Preserve the original Host header including port (e.g., localhost:3050) for upstream URL/HMR checks.
    proxy_set_header Host $http_host;
  }

  # Route all backend API requests (paths starting with /api) to the Express server.
  location /api {
    # Strip the '/api' prefix before forwarding (e.g., /api/values/all -> /values/all).
    # '(.*)' captures everything after '/api/' into $1; 'break' stops Nginx from re-evaluating
    # other location blocks (otherwise the rewritten path would fall through to 'location /').
    rewrite /api/(.*) /$1 break;

    # Forward the rewritten request to the 'api' upstream group defined above.
    proxy_pass http://api;
  }
}
